  - name: Afferrato
    type: rule
    title:
      show: true
      level: 2
    text:
      format: 1
      content: >-
        <ul>
          <li>La velocità di una creatura afferrata diventa 0 e non può beneficiare di alcun bonus alla velocità.</li>
          <li>La condizione termina se il lottatore che ha afferrato la creatura è @UUID[.TpkZgLfxCmSndmpb]{Incapacitato}.</li>
          <li>La condizione termina anche se un effetto rimuove la creatura afferrata dalla portata del lottatore che l'ha afferrata o dall'effetto afferrante, come per esempio
          quando una creatura viene scagliata via dall'incantesimo <i>onda tonante</i>.</li></ul>
