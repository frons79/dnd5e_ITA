  - name: Paralizzato
    type: rule
    title:
      show: true
      level: 2
    text:
      format: 1
      content: >-
        <ul><li>Una creatura paralizzata è @UUID[.TpkZgLfxCmSndmpb]{Incapacitata} 
        e non può muoversi o parlare.</li>
        <li>La creatura fallisce automaticamente i tiri salvezza su Forza e Destrezza.</li>
        <li>I tiri per colpire contro la creatura ottengono vantaggio.</li>
        <li>Ogni attacco che colpisce la creatura è un colpo critico se l'attaccante è situato entro 1,5 metri dalla creatura.</li></ul>
