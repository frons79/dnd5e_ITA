  - name: Indebolimento
    type: rule
    title:
      show: true
      level: 2
    text:
      format: 1
      content: >-
        <p>Alcune capacità speciali e pericoli ambientati, come la fame e gli effetti a lungo termine 
        delle temperature gelide o roventi, possono indurre una condizione speciale chiamata indebolimento.
        L'indebolimento è misurato in sei livelli. Un effetto può imporre a una creatura uno o più lìvelli di 
        indebolimento, come specificato nella descrizione dell'effetto.</p><table
        border="0"><thead><tr><td>Livello</td><td>Effetto</td></tr></thead><tbody><tr><td>1</td><td>Svantaggio alle prove di caratteristica</td>
        </tr><tr><td>2</td><td>Velocità dimezzata</td></tr><tr><td>3</td><td>Svantaggio ai tiri per colpire e ai tiri salvezza</td>
        </tr><tr><td>4</td><td>Massimo dei punti ferita dimezzato</td></tr><tr><td>5</td><td>Velocità ridotta a 0</td></tr><tr>
        <td>6</td><td>Morte</td></tr></tbody></table><p>Se una creatura già sotto l'effetto di indebolimento subisce un ulteriore effetto di indebolimento, il suo attuale 
        livello di indebolimento aumenta dell'ammontare specificato nella descrizione dell'effetto.</p>
        <p>Una creatura subisce l'effetto del suo attuale livello di indebolimento nonchè quelli relativi a tutti i livelli inferiori.
        Per esempio, se una creatura subisce un livello 2 di indebolimento, la sua velocità è dimezzata e le sue prove di caratteristica 
        subiscono svantaggio.</p><p>Un effetto che rimuove l'indebolimento riduce il suo livello come specificato nella descrizlone dell'effetto;
        se il livello di indebolimento di una creatura scende a meno di 1, tutti gli effetti di indebolimento terminano per quella creatura.</p>
        <p>Completando un riposo lungo, una creatura riduce di 1 il suo livello di Indebolimento, purché abbia anche avuto modo di mangiare e bere qualcosa.</p>
    _id: cspWveykstnu3Zcv
