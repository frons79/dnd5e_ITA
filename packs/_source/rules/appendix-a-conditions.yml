  - name: Pietrificato
    type: rule
    title:
      show: true
      level: 2
    text:
      format: 1
      content: "<ul><li>Una creatura pietrificata viene trasformata, assieme a ogni oggetto non magico che stia trasportando o indossando,
      in una sostanza solida inanimata (solitamente la pietra). La creatura cessa di invecchiare e il suo peso viene decuplicato.</li>
      <li>La creatura è @UUID[.TpkZgLfxCmSndmpb]{Incapacitata}, non può muoversi o parlare e non è consapevole di ciò che accade attorno a lei.</li>
      <li>I tiri per colpire contro la creatura ottengono vantaggio.</li>
      <li>La creatura fallisce automaticamente i tiri salvezza su Forza e Destrezza.</li>
      <li>La creatura dispone di resistenza a tutti i danni.</li>
      <li>La creatura è immune ai veleni e alle malattie, ma gli eventuali veleni o malattie già presenti nel suo sistema vengono solo sospesi, non neutralizzati.</li></ul>"
      markdown: ''
