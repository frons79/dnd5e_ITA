  - name: Invisibile
    type: rule
    title:
      show: true
      level: 2
    text:
      format: 1
      content: >-
        <ul>
          <li>Una creatura invisibile è impossibile da vedere senza l'aiuto della magia o di sensi speciali.
          Agli effetti del nascondersi, una creatura invisibile è considerata pesantemente oscurata.
          L'ubicazione della creatura può essere intuita dai rumori che emette o dalle tracce che lascia.</li>
          <li>I tiri per colpire contro la creatura subiscono svantaggio, mentre i tiri per colpire della creatura ottengono vantaggio.</li></ul>
